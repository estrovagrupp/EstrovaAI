<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estrova AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0a;color:#e6e6e6;font-family:Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column;}

/* HEADER - see sama mis sul oli, ainult fix */
.header{
  position:sticky;top:0;z-index:20;
  background:#0a0a0a;
  border-bottom:1px solid #1e1e1e;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  padding-top:max(14px, env(safe-area-inset-top));
  padding-top:calc(14px + env(safe-area-inset-top));
}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px;letter-spacing:-0.2px}
.logo-img{width:38px;height:38px;border-radius:10px;background:#0e152a;border:1.5px solid #2a5bd7;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo-img img{width:100%;height:100%;object-fit:cover}
.limit{font-size:12px;color:#7a7a9a;background:#14141c;border:1px solid #232330;padding:6px 12px;border-radius:20px}

#chat{flex:1;overflow-y:auto;padding:20px 16px 120px;max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.msg{font-size:15.5px;line-height:1.6;word-wrap:break-word}
.msg.bot{color:#d8d8de;max-width:92%}
.msg.user{align-self:flex-end;background:#332a5c;color:#e9e6ff;padding:12px 18px;border-radius:22px;font-size:15px;max-width:80%}
.actions{display:flex;gap:8px;margin-top:10px}
.copy{font-size:12px;padding:6px 12px;border-radius:18px;border:1px solid #252530;background:#17171e;color:#6e6e80;cursor:pointer}
.copy:hover{color:#a0a0b0}

/* INPUT - sama mis sul oli */
.bottom{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top, #0a0a0a 60%, transparent);padding:12px 12px max(12px, env(safe-area-inset-bottom));}
.bar{max-width:760px;margin:0 auto;background:#17171e;border:1px solid #2a2a36;border-radius:28px;display:flex;align-items:center;padding:6px 6px 6px 14px;gap:8px}
.bar:focus-within{border-color:#7c6cff}
.bar input{flex:1;background:transparent;border:none;outline:none;color:white;font-size:15px;padding:8px 0}
.icon{opacity:.6}
.send{width:36px;height:36px;border-radius:50%;background:#7c6cff;border:none;color:white;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-img">🌊</div> Estrova AI</div>
  <div class="limit" id="limit">Limit: 0/100</div>
</div>

<div id="chat">
  <div class="msg bot">Hello! I'm Estrova AI - built in Estonia with EstrovaID.<br>How can I help? I don't bite :)</div>
</div>

<div class="bottom">
  <div class="bar">
    <span class="icon">🖼️</span>
    <input id="inp" placeholder="Ask anything!" autocomplete="off"/>
    <button class="send" id="send">↑</button>
  </div>
</div>

<script>
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), btn=document.getElementById('send'), limit=document.getElementById('limit');
let c=0, last='';
function add(text,who){
  const d=document.createElement('div'); d.className='msg '+who;
  d.innerHTML=who==='user'? text.replace(/</g,'&lt;') : text.replace(/\n/g,'<br>');
  if(who==='bot'){
    const a=document.createElement('div'); a.className='actions';
    a.innerHTML=`<button class="copy" onclick="navigator.clipboard.writeText(this.parentElement.parentElement.innerText.replace('CopyRedo',''))">⧉ Copy</button><button class="copy" onclick="redo()">↺ Redo</button>`;
    d.appendChild(a);
  }
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
function redo(){ if(last){ inp.value=last; send(); } }
async function send(){
  const t=inp.value.trim(); if(!t) return;
  last=t; add(t,'user'); inp.value=''; c++; limit.textContent=`Limit: ${c}/100`;
  const load=document.createElement('div'); load.className='msg bot'; load.textContent='...'; chat.appendChild(load);
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
    const j=await r.json(); load.remove();
    if(j.reply) add(j.reply,'bot'); else add('Ühenduse viga: '+(j.error||'error'),'bot');
  }catch(e){ load.remove(); add('Ühenduse viga, proovi uuesti!','bot'); }
}
btn.onclick=send; inp.onkeydown=e=>{ if(e.key==='Enter') send(); };
</script>
</body>
</html>
