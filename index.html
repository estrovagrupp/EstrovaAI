<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Estrova AI v1.0 - EstrovaID</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
body{background:#0b0b0e;color:#f8fafc;font-family:Inter,sans-serif;overflow:hidden;height:100vh;margin:0;display:flex;transition:background 0.3s,color 0.3s}
body.theme-light{background:#f1f5f9;color:#0f172a}
body.theme-light .login-card{background:#ffffff;border-color:#cbd5e1}
body.theme-light .sidebar, body.theme-light .top-header, body.theme-light .neon-inner{background:#ffffff;border-color:#cbd5e1}
body.theme-light .message-user{background:#dbeafe;border-color:#bfdbfe;color:#1e3a8a}
body.theme-light .message-ai-text{color:#0f172a}
body.theme-light .chat-item{border-color:#cbd5e1;background:#ffffff}
body.theme-light .chat-item.active{background:rgba(37,99,235,0.1);border-color:#2563eb}
body.theme-light input, body.theme-light textarea{background:#ffffff!important;color:#0f172a!important;border-color:#cbd5e1!important}
body.theme-light #headerLimit, body.theme-light #limitBadge, body.theme-light #settingsLimitCount, body.theme-light [id^="limit"]{background:#ffffff!important;color:#0f172a!important;border:1px solid #cbd5e1!important}
body.theme-light #settingsModal, body.theme-light #settingsModal > div, body.theme-light #appModal > div, body.theme-light .settings-card{background:#ffffff!important;color:#0f172a!important;border-color:#cbd5e1!important}
body.theme-light #settingsModal select, body.theme-light #settingsModal button, body.theme-light #appModal select, body.theme-light #appModal button{border-color:#cbd5e1!important}
body.theme-light .settings-overlay, body.theme-light .modal-overlay{background:rgba(241,245,249,0.8)!important}
body.theme-light .chat-item-actions button{background:#ffffff!important;color:#475569!important;border-color:#cbd5e1!important}
body.theme-light .message-ai-actions button{background:#ffffff!important;color:#475569!important;border-color:#cbd5e1!important}

#loginScreen{position:fixed;inset:0;background:#030307;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
body.theme-light #loginScreen{background:#f1f5f9}
.login-card{background:#121217;border:1px solid #1e1e24;border-radius:24px;padding:28px;width:100%;max-width:360px;margin:auto;text-align:center}
.login-outer-rainbow{background:linear-gradient(270deg,#3b82f6,#8b5cf6,#ec4899,#3b82f6);background-size:400% 400%;animation:rainbow 6s ease infinite;padding:3px;border-radius:26px;max-width:366px;width:100%;margin:auto}
@keyframes rainbow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body.theme-light .login-outer-rainbow{background:linear-gradient(270deg,#3b82f6,#8b5cf6,#ec4899,#3b82f6);background-size:400% 400%;animation:rainbow 6s ease infinite}
.input-wrap{margin-bottom:14px}
.input-wrap input{width:100%;background:#0b0b0e;border:1px solid #1e1e24;border-radius:12px;padding:14px;font-size:16px;outline:none;color:white;text-align:center;font-weight:600}
.btn-primary{width:100%;background:#2563eb;color:white;border:none;padding:14px;border-radius:12px;font-weight:700;cursor:pointer;margin-top:6px}
.btn-secondary{width:100%;background:transparent;color:#94a3b8;border:1px solid #1e1e24;padding:12px;border-radius:12px;margin-top:10px;cursor:pointer}
.sidebar{position:fixed;top:0;left:-320px;width:300px;height:100%;background:#121217;border-right:1px solid #1e1e24;transition:left .3s;z-index:50;display:flex;flex-direction:column;padding:20px;
-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
.sidebar.open{left:0}
.top-header{height:60px;border-bottom:1px solid #1e1e24;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0d0d11}
.chat-layout{flex-grow:1;display:flex;flex-direction:column;height:100vh}
.chat-stream{flex-grow:1;overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;gap:6px;max-width:900px;width:100%;margin:0 auto}
.message-user{align-self:flex-end;background:#1e1b4b;border:1px solid #2a2a50;border-radius:18px;padding:10px 14px;max-width:72%;font-size:14px;line-height:1.4;word-break:break-word;margin-right:12px;display:flex;flex-direction:column;gap:4px}
.message-user img{max-width:100px;max-height:100px;border-radius:8px;object-fit:cover;margin:2px}
.message-ai-wrap{align-self:center;width:100%;max-width:760px;display:flex;flex-direction:column;padding:6px 16px}
.message-ai-text{font-size:15px;line-height:1.6;color:#e2e8f0;white-space:pre-wrap;word-break:break-word}
.message-ai-actions{display:flex;gap:8px;margin-top:10px;opacity:0.8}
.message-ai-actions button{background:#1e1e24;border:1px solid #2a2a30;color:#94a3b8;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px}
.message-ai-actions button:hover{background:#2563eb;color:white;border-color:#2563eb}
.typing-wrap{align-self:center;padding:8px 16px;display:flex;justify-content:center;align-items:center}
.stage{position:relative;width:60px;height:40px;display:flex;justify-content:center;align-items:center}
.dot{position:absolute;width:8px;height:8px;background-color:#ffffff;border-radius:50%;animation-duration:7.2s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(0.45, 0, 0.15, 1)}
body.theme-light .dot{background-color:#0f172a}
.dot-1{animation-name:moveDot1}
.dot-2{animation-name:moveDot2}
.dot-3{animation-name:moveDot3}
@keyframes moveDot1{
0%{transform:translate(-18px,0)}
5.55%{transform:translate(-18px,-12px)}
11.11%{transform:translate(-18px,0)}
16.66%{transform:translate(-18px,-12px)}
22.22%{transform:translate(-18px,0)}
27.77%{transform:translate(-18px,-12px)}
33.33%{transform:translate(-18px,0)}
38.88%{transform:translate(-18px,-12px)}
44.44%{transform:translate(-18px,0)}
50%{transform:translate(-18px,-12px)}
55.55%{transform:translate(-18px,0)}
62.5%{transform:translate(0px,-14px)}
69.5%{transform:translate(14px,10px)}
76.5%{transform:translate(-14px,10px)}
83.5%{transform:translate(0px,-14px)}
90.5%{transform:translate(14px,10px)}
97.5%{transform:translate(-14px,10px)}
100%{transform:translate(-18px,0)}
}
@keyframes moveDot2{
0%{transform:translate(0,0)}
2.77%{transform:translate(0,0)}
8.33%{transform:translate(0,-12px)}
13.88%{transform:translate(0,0)}
19.44%{transform:translate(0,-12px)}
25%{transform:translate(0,0)}
30.55%{transform:translate(0,-12px)}
36.11%{transform:translate(0,0)}
41.66%{transform:translate(0,-12px)}
47.22%{transform:translate(0,0)}
52.77%{transform:translate(0,-12px)}
55.55%{transform:translate(0,0)}
62.5%{transform:translate(14px,10px)}
69.5%{transform:translate(-14px,10px)}
76.5%{transform:translate(0px,-14px)}
83.5%{transform:translate(14px,10px)}
90.5%{transform:translate(-14px,10px)}
97.5%{transform:translate(0px,-14px)}
100%{transform:translate(0,0)}
}
@keyframes moveDot3{
0%{transform:translate(18px,0)}
5.55%{transform:translate(18px,0)}
11.11%{transform:translate(18px,-12px)}
16.66%{transform:translate(18px,0)}
22.22%{transform:translate(18px,-12px)}
27.77%{transform:translate(18px,0)}
33.33%{transform:translate(18px,-12px)}
38.88%{transform:translate(18px,0)}
44.44%{transform:translate(18px,-12px)}
50%{transform:translate(18px,0)}
55.55%{transform:translate(18px,0)}
62.5%{transform:translate(-14px,10px)}
69.5%{transform:translate(0px,-14px)}
76.5%{transform:translate(14px,10px)}
83.5%{transform:translate(-14px,10px)}
90.5%{transform:translate(0px,-14px)}
97.5%{transform:translate(14px,10px)}
100%{transform:translate(18px,0)}
}
.wave-btn{width:40px;height:40px;border-radius:10px;overflow:hidden;border:2px solid #2563eb;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wave-btn img{width:100%;height:100%;object-fit:cover}
.chat-item{padding:10px 12px;border:1px solid #1e1e24;border-radius:10px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;position:relative;
-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.chat-item *{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
.chat-item.active{background:rgba(37,99,235,0.15);border-color:#2563eb}
.chat-item-title{flex-grow:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
-webkit-touch-callout:none;pointer-events:none}
.chat-item-actions{display:flex;gap:5px;opacity:0;transition:opacity 0.15s;pointer-events:none;position:absolute;right:8px;background:#121217;padding-left:6px;border-radius:6px}
body.theme-light .chat-item-actions{background:#ffffff}
.chat-item-actions button{width:24px;height:24px;border-radius:6px;border:1px solid #2a2a30;background:#1e1e24;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer}
.chat-item-actions button:hover{background:#2563eb;color:white}
@media (min-width:768px){.chat-item:hover .chat-item-actions{opacity:1;pointer-events:all} .chat-item:hover .chat-item-title{margin-right:60px}}
@media (max-width:767px){.chat-item-actions{display:none!important}}
.context-menu{position:fixed;background:#1e1e24;border:1px solid #2a2a30;border-radius:12px;padding:6px;z-index:200;min-width:140px}
.context-menu button{width:100%;text-align:left;padding:8px 10px;border:none;background:none;color:white;font-size:12px;border-radius:8px;display:flex;gap:6px;cursor:pointer}
.neon-input-container{background:linear-gradient(270deg,#3b82f6,#8b5cf6,#ec4899,#3b82f6);background-size:400% 400%;animation:rainbow 6s ease infinite;padding:2px;border-radius:16px;max-width:800px;margin:0 auto;width:100%}
.neon-inner{background:#0d0d11;border-radius:14px;display:flex;flex-direction:column;padding:5px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e1e24;border:1px solid #2a2a30;color:white;padding:8px 14px;border-radius:20px;font-size:12px;z-index:9999;animation:toastIn 0.2s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

body.theme-light .bg-gray-900, body.theme-light [style*="background:#0"]{background:#ffffff!important;color:#0f172a!important;border:1px solid #cbd5e1!important}

</style>
</head>

<script>
var isGenerating=false;
var currentLang='en';
var currentTheme='dark';
var translations={
en:{welcome:"Hello! I'm Estrova AI - built in Estonia with EstrovaID. How can I help? I don't bite :)",newChat:"New Chat",placeholder:"Ask anything!",settings:"Settings",lang:"Language",theme:"Theme",save:"Save",chats:"Chats",signOut:"Sign Out",rename:"Rename",del:"Delete",limit:"Limit",copy:"Copy",redo:"Redo",copied:"Copied",continue:"Continue"},
et:{welcome:"Tere! Olen Estrova AI - loodud Eestis EstrovaID-ga. Kuidas saan aidata? Ma ei hammusta :)",newChat:"Uus vestlus",placeholder:"Ära karda küsida!",settings:"Seaded",lang:"Keel",theme:"Teema",save:"Salvesta",chats:"Vestlused",signOut:"Logi välja",rename:"Muuda nime",del:"Kustuta",limit:"Limiit",copy:"Kopeeri",redo:"Tee uuesti",copied:"Kopeeritud",continue:"Jätka"},
ru:{welcome:"Привет! Я Estrova AI из Эстонии с EstrovaID. Чем помочь?",newChat:"Новый чат",placeholder:"Спрашивайте!",settings:"Настройки",lang:"Язык",theme:"Тема",save:"Сохранить",chats:"Чаты",signOut:"Выйти",rename:"Переименовать",del:"Удалить",limit:"Лимит",copy:"Копировать",redo:"Повторить",copied:"Скопировано",continue:"Продолжить"}
};

var chats=[],activeChatId=null,selectedImages=[],currentUser=null;
var messageCount=0;

// PERSISTENT STORAGE - same keys forever, never reset
function getIdData(id){
  try{
    var data=localStorage.getItem('estrova_data_'+id);
    if(data){
      var parsed=JSON.parse(data);
      // Ensure structure
      if(!parsed.chats) parsed.chats=[];
      if(parsed.count===undefined) parsed.count=0;
      return parsed;
    }
  }catch(e){console.log('Parse error',e);}
  return {chats:[],count:0,countDay:new Date().toDateString(),lang:'en',theme:'dark'};
}
function saveCurrentIdData(){
  if(!currentUser) return;
  var data={
    chats:chats.slice(0,5),
    count:messageCount,
    countDay:localStorage.getItem('estrova_count_day')||new Date().toDateString(),
    lang:currentLang,
    theme:currentTheme
  };
  try{
    localStorage.setItem('estrova_data_'+currentUser.id, JSON.stringify(data));
    localStorage.setItem('estrova_count', messageCount);
    localStorage.setItem('estrova_count_day', data.countDay);
    localStorage.setItem('estrova_lang_'+currentUser.id, currentLang);
    localStorage.setItem('estrova_theme_'+currentUser.id, currentTheme);
    localStorage.setItem('estrova_lang_global', currentLang);
    localStorage.setItem('estrova_theme_global', currentTheme);
    console.log('Saved data for',currentUser.id, data.chats.length+' chats');
  }catch(e){console.error('Save failed',e);}
}

function pruneOldMessages(chat){
  var MAX=25;
  var MAX_MSG=1+MAX*2;
  if(chat.messages.length>MAX_MSG){
    var excess=chat.messages.length-MAX_MSG;
    chat.messages.splice(1,excess);
  }
}

function showToast(msg){
  var existing=document.querySelectorAll('.toast');
  existing.forEach(function(e){e.remove();});
  var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode) t.remove();},1800);
}

function showError(m){var e=document.getElementById('authError');if(e){e.textContent=m;e.style.display='block';}}

function applyTheme(theme){
  currentTheme=theme;
  document.body.className=theme==='light'?'theme-light':'theme-dark';
  var ia=document.getElementById('inputArea'); if(ia){ia.style.background=theme==='light'?'#ffffff':'#0b0b0e';}
}

function updateLang(lang){
  currentLang=lang;
  var t=translations[lang]||translations['en'];
  var el=document.getElementById('userInput'); if(el) el.placeholder=t.placeholder;
  var nct=document.getElementById('newChatText'); if(nct) nct.textContent=t.newChat;
  var ct=document.getElementById('chatsTitle'); if(ct) ct.textContent=t.chats;
  var st=document.getElementById('settingsTitle'); if(st) st.textContent=t.settings;
  var ll=document.getElementById('langLabel'); if(ll) ll.textContent=t.lang;
  var tl=document.getElementById('themeLabel'); if(tl) tl.textContent=t.theme;
  var ss=document.getElementById('saveSettingsBtn'); if(ss) ss.textContent=t.save;
  var sot=document.getElementById('signOutText'); if(sot) sot.textContent=t.signOut;
  var limL=document.getElementById('limitLabel'); if(limL) limL.textContent=t.limit;
  var cb=document.getElementById('continueBtn'); if(cb) cb.textContent=t.continue;
  var cr=document.getElementById('ctxRename'); if(cr) cr.textContent=t.rename;
  var cd=document.getElementById('ctxDelete'); if(cd) cd.textContent=t.del;
  updateLimitDisplays();
}

function startApp(id){
  console.log('startApp',id);
  currentUser={id:id};
  var idData=getIdData(id);
  var welcomeText=(translations[idData.lang||'en']||translations['en']).welcome;
  if(idData.chats&&idData.chats.length>0){
    chats=idData.chats;
  }else{
    chats=[{id:'chat_'+Date.now(),title:'New Chat',messages:[{role:'assistant',text:welcomeText,isGreeting:true}]}];
  }
  activeChatId=chats[0].id;
  messageCount=idData.count||0;
  var today=new Date().toDateString();
  if(idData.countDay!==today){messageCount=0;}
  currentLang=idData.lang||localStorage.getItem('estrova_lang_'+id)||'en';
  currentTheme=idData.theme||localStorage.getItem('estrova_theme_'+id)||'dark';
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='flex';
  document.getElementById('userIdDisplay').textContent=id;
  var sid=document.getElementById('settingsId'); if(sid) sid.textContent=id;
  localStorage.setItem('estrova_current_id',id);
  localStorage.setItem('estrova_count',messageCount);
  localStorage.setItem('estrova_count_day',today);
  var langSel=document.getElementById('languageSelect'); if(langSel) langSel.value=currentLang;
  var themeSel=document.getElementById('themeSelect'); if(themeSel) themeSel.value=currentTheme;
  applyTheme(currentTheme);
  updateLang(currentLang);
  renderChats();renderStream();
  updateLimitDisplays();
}

function updateLimitDisplays(){
  var t=translations[currentLang]||translations['en'];
  var txt=t.limit+': '+messageCount+'/100';
  var a=document.getElementById('headerLimit'); if(a) a.textContent=txt;
  var c=document.getElementById('limitBadge'); if(c) c.textContent=txt;
  var d=document.getElementById('settingsLimitCount'); if(d) d.textContent=messageCount+'/100';
  var e=document.getElementById('settingsChatCount'); if(e) e.textContent=chats.length;
}

function doContinue(){
  var input=document.getElementById('estrovaIdInput');
  if(!input) return;
  var v=input.value.trim();
  if(!v){showError('Enter EstrovaID');return;}
  if(v.length<3){showError('Min 3 chars');return;}
  startApp(v);
}
function doSignOut(){localStorage.removeItem('estrova_current_id');location.reload();}

document.addEventListener('DOMContentLoaded',function(){
  var input=document.getElementById('estrovaIdInput');
  if(input) input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doContinue();}});
  var saved=localStorage.getItem('estrova_current_id');
  if(saved) setTimeout(function(){startApp(saved);},100);
  var btn=document.getElementById('continueBtn');
  if(btn) btn.addEventListener('click',doContinue);
  var gl=localStorage.getItem('estrova_lang_global')||'en';
  var gt=localStorage.getItem('estrova_theme_global')||'dark';
  applyTheme(gt);
  updateLang(gl);
  var langSel=document.getElementById('languageSelect'); if(langSel) langSel.value=gl;
  var themeSel=document.getElementById('themeSelect'); if(themeSel) themeSel.value=gt;
});

function showModal(opts){
  var modal=document.getElementById('appModal');
  document.getElementById('modalTitle').textContent=opts.title;
  var d=document.getElementById('modalDesc'); if(d){if(opts.desc){d.textContent=opts.desc;d.style.display='block';} else d.style.display='none';}
  var input=document.getElementById('modalInput'); if(input){if(opts.inputDefault!==undefined){input.value=opts.inputDefault;input.style.display='block';} else input.style.display='none';}
  var cancel=document.getElementById('modalCancelBtn'); if(cancel){if(opts.showCancel) cancel.style.display='block'; else cancel.style.display='none';}
  modal.style.display='flex';
  var clean=function(){modal.style.display='none';document.getElementById('modalOkBtn').onclick=null;cancel.onclick=null;};
  document.getElementById('modalOkBtn').onclick=function(){var v=opts.inputDefault!==undefined?input.value:true;clean();if(opts.onOk) opts.onOk(v);};
  cancel.onclick=clean;
}
function renderChats(){
  var list=document.getElementById('chatHistoryList'); if(!list) return; list.innerHTML='';
  for(var i=0;i<chats.length;i++){
    var chat=chats[i];
    var div=document.createElement('div');
    div.className='chat-item '+(chat.id===activeChatId?'active':'');
    div.setAttribute('unselectable','on');
    div.setAttribute('onselectstart','return false');
    div.draggable=false;
    div.innerHTML='<span class="chat-item-title" unselectable="on" onselectstart="return false">'+chat.title+'</span><div class="chat-item-actions"><button onclick="event.stopPropagation();renameChat(\''+chat.id+'\')" title="Rename"><i class="fa-solid fa-pen"></i></button><button onclick="event.stopPropagation();deleteChat(\''+chat.id+'\')" title="Delete"><i class="fa-solid fa-trash"></i></button></div>';
    (function(c){div.onclick=function(){activeChatId=c.id;renderChats();renderStream();document.getElementById('sidebar').classList.remove('open');};})(chat);
    (function(c,el){
      var timer=null;
      el.addEventListener('touchstart',function(e){timer=setTimeout(function(){showContextMenu(c.id,e.touches[0].clientX,e.touches[0].clientY);},500);},{passive:true});
      el.addEventListener('touchend',function(){clearTimeout(timer);});
      el.addEventListener('contextmenu',function(e){e.preventDefault();showContextMenu(c.id,e.clientX,e.clientY);});
    })(chat,div);
    list.appendChild(div);
  }
}
var contextMenuChatId=null;
function showContextMenu(id,x,y){contextMenuChatId=id;var m=document.getElementById('contextMenu');m.style.left=x+'px';m.style.top=y+'px';m.style.display='block';}
function hideContextMenu(){var m=document.getElementById('contextMenu');if(m)m.style.display='none';}
document.addEventListener('click',function(e){if(!e.target.closest('#contextMenu')&&!e.target.closest('.chat-item'))hideContextMenu();});
function contextRename(){hideContextMenu();if(contextMenuChatId)renameChat(contextMenuChatId);}
function contextDelete(){hideContextMenu();if(contextMenuChatId)deleteChat(contextMenuChatId);}
function renameChat(id){for(var i=0;i<chats.length;i++)if(chats[i].id===id){(function(idx){showModal({title:'Rename:',inputDefault:chats[idx].title,showCancel:true,onOk:function(nn){if(nn&&nn.trim()){chats[idx].title=nn.trim();saveCurrentIdData();renderChats();}}});})(i);break;}}
function deleteChat(id){if(chats.length<=1){showModal({title:'Min 1 chat'});return;}for(var i=0;i<chats.length;i++)if(chats[i].id===id){(function(idx){showModal({title:'Delete?',desc:'"'+chats[idx].title+'"',showCancel:true,onOk:function(){chats.splice(idx,1);if(activeChatId===id)activeChatId=chats[0].id;saveCurrentIdData();renderChats();renderStream();}});})(i);break;}}

function copyText(text, btn){
  var t=translations[currentLang]||translations['en'];
  function done(){
    showToast(t.copied||'Copied');
    if(btn){var old=btn.innerHTML;btn.innerHTML='<i class="fa-solid fa-check"></i> '+(t.copied||'Copied');setTimeout(function(){btn.innerHTML=old;},1400);}
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(function(){
      fallbackCopy(text, done);
    });
  }else{fallbackCopy(text, done);}
}
function fallbackCopy(text, cb){
  var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');cb();}catch(e){showToast('Copy failed');}
  ta.remove();
}

async function redoMessage(aiIndex){
  var chat=null; for(var i=0;i<chats.length;i++) if(chats[i].id===activeChatId){chat=chats[i];break;}
  if(!chat || aiIndex<0) return;
  var userText=null;
  var userImages=null;
  for(var j=aiIndex-1;j>=0;j--){if(chat.messages[j].role==='user'){userText=chat.messages[j].text;userImages=chat.messages[j].images||null;break;}}
  if(!userText && !userImages) return;
  isGenerating=true;
  var btn=document.getElementById('sendBtn'); if(btn){btn.disabled=true;btn.style.opacity='0.5';}
  var loading=document.createElement('div');loading.className='typing-wrap';loading.id='typingIndicator';loading.innerHTML='<div class="stage"><div class="dot dot-1"></div><div class="dot dot-2"></div><div class="dot dot-3"></div></div>';document.getElementById('chatStream').appendChild(loading);
  try{
    chat.messages.splice(aiIndex,1);
    renderStream();
    var newLoading=document.createElement('div');newLoading.className='typing-wrap';newLoading.id='typingIndicator';newLoading.innerHTML='<div class="stage"><div class="dot dot-1"></div><div class="dot dot-2"></div><div class="dot dot-3"></div></div>';document.getElementById('chatStream').appendChild(newLoading);
    var reply=await callAI(userText||'', userImages||[]);
    var el=document.getElementById('typingIndicator');if(el)el.remove();
    chat.messages.splice(aiIndex,0,{role:'assistant',text:reply});
    saveCurrentIdData();renderStream();
  }catch(e){
    var el2=document.getElementById('typingIndicator');if(el2)el2.remove();
  }finally{
    isGenerating=false;
    var b=document.getElementById('sendBtn');if(b){b.disabled=false;b.style.opacity='1';}
  }
}

function renderStream(){
  var s=document.getElementById('chatStream');if(!s)return;s.innerHTML='';
  var chat=null;for(var i=0;i<chats.length;i++)if(chats[i].id===activeChatId){chat=chats[i];break;}
  if(!chat)return;
  var t=translations[currentLang]||translations['en'];
  for(var j=0;j<chat.messages.length;j++){
    var m=chat.messages[j];
    if(m.role==='user'){
      var div=document.createElement('div');div.className='message-user';
      if(m.images&&m.images.length>0){
        var imgWrap=document.createElement('div');imgWrap.style.display='flex';imgWrap.style.gap='4px';imgWrap.style.flexWrap='wrap';
        for(var k=0;k<m.images.length;k++){var img=document.createElement('img');img.src=m.images[k].dataUrl;img.style.maxWidth='100px';img.style.maxHeight='100px';img.style.borderRadius='8px';imgWrap.appendChild(img);}
        div.appendChild(imgWrap);
      }
      if(m.text){var txt=document.createElement('div');txt.textContent=m.text;div.appendChild(txt);}
      s.appendChild(div);
    }else{
      var wrap=document.createElement('div');wrap.className='message-ai-wrap';
      if(m.images&&m.images.length>0){
        var imgWrap2=document.createElement('div');imgWrap2.style.display='flex';imgWrap2.style.gap='4px';imgWrap2.style.flexWrap='wrap';imgWrap2.style.marginBottom='6px';
        for(var k2=0;k2<m.images.length;k2++){var img2=document.createElement('img');img2.src=m.images[k2].dataUrl;img2.style.maxWidth='100px';img2.style.maxHeight='100px';img2.style.borderRadius='8px';imgWrap2.appendChild(img2);}
        wrap.appendChild(imgWrap2);
      }
      var textDiv=document.createElement('div');textDiv.className='message-ai-text';textDiv.textContent=m.text;
      wrap.appendChild(textDiv);
      if(!m.isGreeting){
        var actions=document.createElement('div');actions.className='message-ai-actions';
        var isLastAi = (j===chat.messages.length-1);
        var copyBtn=document.createElement('button');copyBtn.innerHTML='<i class="fa-regular fa-copy"></i> '+t.copy;
        (function(txt,btn){copyBtn.onclick=function(){copyText(txt,btn);};})(m.text,copyBtn);
        actions.appendChild(copyBtn);
        if(isLastAi){
          var redoBtn=document.createElement('button');redoBtn.innerHTML='<i class="fa-solid fa-rotate"></i> '+t.redo;
          (function(idx){redoBtn.onclick=function(){redoMessage(idx);};})(j);
          actions.appendChild(redoBtn);
        }
        wrap.appendChild(actions);
      }
      s.appendChild(wrap);
    }
  }
  s.scrollTop=s.scrollHeight;
}

document.getElementById('newChatBtn').onclick=function(){
  var t=translations[currentLang]||translations['en'];
  if(chats.length>=5){showModal({title:'Max 5 chats'});return;}
  var welcome=(translations[currentLang]||translations['en']).welcome;
  var id='chat_'+Date.now();chats.unshift({id:id,title:t.newChat,messages:[{role:'assistant',text:welcome,isGreeting:true}]});activeChatId=id;saveCurrentIdData();renderChats();renderStream();document.getElementById('sidebar').classList.remove('open');
};
document.getElementById('openSettingsBtn').onclick=function(){
  document.getElementById('settingsModal').style.display='flex';
  updateLimitDisplays();

// API võti on nüüd backendis, frontendis pole vaja
const API_KEY = ""; // jäetud tühjaks turvalisuse pärast
const GEMINI_KEY = "";

// callGemini eemaldatud - kasutame callAI-d

async function callAI(text, images){
  // UUS TURVALINE VERSIOON - räägib sinu enda backendiga
  try{
    var payload = {
      text: text,
      userId: currentUser ? currentUser.id : '123456',
      images: (images || []).map(function(img){ return { base64: img.base64, mimeType: img.mimeType || 'image/jpeg' }; })
    };
    
    // Kui oled Vercelis, siis /api/chat. Kui testid lokaalselt ilma backendita, proovib otse Geminit
    var backendUrl = '/api/chat';
    var res = await fetch(backendUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if(res.ok){
      var data = await res.json();
      if(data.reply) return data.reply;
    }
    
    // Fallback: otse Gemini (ainult lokaalseks testiks, kui backend pole veel üleval ja API_KEY on ajutiselt pandud)
    if(API_KEY && API_KEY.length > 10){
      console.log('Backend ei vasta, proovin otse Geminit (ajutine)');
      var parts = [];
      if(text) parts.push({ text: 'You are Estrova AI, built in Estonia. Be friendly, concise. User ID: ' + (currentUser ? currentUser.id : '123456') + '. User says: ' + text });
      if(images && images.length>0){
        images.forEach(function(img){
          if(img.base64) parts.push({ inlineData: { mimeType: img.mimeType || 'image/jpeg', data: img.base64 } });
        });
      }
      var res2 = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: parts }] })
      });
      if(res2.ok){
        var data2 = await res2.json();
        var reply2 = data2.candidates?.[0]?.content?.parts?.[0]?.text;
        if(reply2) return reply2;
      }
    }

  }catch(e){ 
    console.error('callAI error:', e); 
  }
  
  // Viimane fallback - Pollinations (ei vaja võtit)
  try{
    var prompt='You are Estrova AI Estonia friendly concise ID '+(currentUser?currentUser.id:'123456')+': '+text;
    var pr=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt), {headers:{'Cache-Control':'no-cache'}});
    if(pr.ok){var t=await pr.text(); if(t&&t.length>3) return t;}
  }catch(e){}

  return "Tere! Olen Estrova AI (ID "+(currentUser?currentUser.id:'123456')+"). Ühenduse viga, proovi uuesti!";
}
document.getElementById('promptForm').addEventListener('submit',async function(e){
  e.preventDefault();
  if(isGenerating) return;
  var input=document.getElementById('userInput');if(!input)return;
  var text=input.value.trim();
  if(!text&&selectedImages.length===0) return;
  var imgs=selectedImages.slice();
  isGenerating=true;
  var btn=document.getElementById('sendBtn'); if(btn){btn.disabled=true;btn.style.opacity='0.5';}
  messageCount++; 
  localStorage.setItem('estrova_count',messageCount);
  localStorage.setItem('estrova_count_day',new Date().toDateString());
  updateLimitDisplays();
  var chat=null;for(var i=0;i<chats.length;i++)if(chats[i].id===activeChatId){chat=chats[i];break;}
  if(chat&&chat.messages.length<=1&&text) chat.title=text.substring(0,24);
  if(chat){var msgObj={role:'user',text:text}; if(imgs&&imgs.length>0){msgObj.images=imgs.map(function(i){return {dataUrl:i.dataUrl};});} chat.messages.push(msgObj);}
  input.value='';selectedImages=[];renderPreviews();renderChats();renderStream();
  saveCurrentIdData();
  var loading=document.createElement('div');loading.className='typing-wrap';loading.id='typingIndicator';loading.innerHTML='<div class="stage"><div class="dot dot-1"></div><div class="dot dot-2"></div><div class="dot dot-3"></div></div>';document.getElementById('chatStream').appendChild(loading);document.getElementById('chatStream').scrollTop=99999;
  try{
    var reply=await callAI(text,imgs);
    var el=document.getElementById('typingIndicator');if(el)el.remove();
    if(chat){chat.messages.push({role:'assistant',text:reply});pruneOldMessages(chat);}
    saveCurrentIdData();renderStream();
  }catch(err){
    var el2=document.getElementById('typingIndicator');if(el2)el2.remove();
  }finally{
    isGenerating=false;
    var b=document.getElementById('sendBtn');if(b){b.disabled=false;b.style.opacity='1';}
    var inp=document.getElementById('userInput');if(inp){inp.disabled=false;inp.focus();}
  }
});
