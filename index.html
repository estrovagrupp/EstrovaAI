<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estrova AI v1.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<style>
  :root { --bg:#0a0a0a; --card:#1a1a1f; --accent:#6d5bff; --text:#e8e8e8; --muted:#8a8a9a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family: Inter, system-ui, sans-serif;}
  body{padding-top:env(safe-area-inset-top); display:flex; flex-direction:column;}

  /* HEADER - FIXED */
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(10,10,10,0.9); backdrop-filter:blur(12px);
    border-bottom:1px solid #222;
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    height:auto; min-height:58px;
  }
 .logo{display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px;}
 .logo-icon{width:32px;height:32px; border-radius:8px; background:#111; border:1px solid #6d5bff; display:grid;place-items:center;}
 .limit{font-size:12px; color:var(--muted); background:#15151b; border:1px solid #222; padding:6px 10px; border-radius:20px;}

  /* CHAT AREA */
  #chat{flex:1; overflow-y:auto; padding:24px 16px 140px; display:flex; flex-direction:column; gap:18px; max-width:800px; margin:0 auto; width:100%;}
 .msg{line-height:1.6; font-size:15px; max-width:90%; animation: fade.2s;}
 .msg.user{align-self:flex-end; background:var(--accent); color:white; padding:12px 16px; border-radius:22px 22px 6px 22px;}
 .msg.bot{align-self:flex-start; color:var(--text);}
 .msg.bot small{color:var(--muted); display:block; margin-top:4px;}
 .actions{display:flex; gap:8px; margin-top:10px;}
 .btn{font-size:12px; padding:6px 12px; border-radius:20px; border:1px solid #2a2a32; background:#1c1c22; color:var(--muted); cursor:pointer;}
 .btn:hover{color:var(--text); border-color:#444;}

  /* INPUT */
 .input-wrap{position:fixed; bottom:0; left:0; right:0; background:linear-gradient(transparent, var(--bg) 20%); padding:16px; padding-bottom:max(16px, env(safe-area-inset-bottom));}
 .input-bar{max-width:800px; margin:0 auto; display:flex; align-items:center; gap:10px; background:#15151a; border:1px solid #2d2d3a; border-radius:28px; padding:6px 6px 6px 16px; box-shadow:0 0 0 1px #6d5bff33;}
 .input-bar:focus-within{border-color:var(--accent); box-shadow:0 0 0 2px #6d5bff55;}
 .input-bar input{flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:15px; padding:8px 0;}
 .send{width:36px;height:36px;border-radius:50%; background:var(--accent); border:none; color:white; cursor:pointer; display:grid; place-items:center; font-weight:bold;}
 .send:disabled{opacity:.5}

  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-icon">🌊</div> Estrova AI</div>
  <div class="limit" id="limit">Limit: 0/100</div>
</header>

<div id="chat">
  <div class="msg bot">Hello! I'm Estrova AI - built in Estonia with EstrovaID.<br>How can I help? I don't bite :)</div>
</div>

<div class="input-wrap">
  <div class="input-bar">
    <span style="opacity:.5">🖼️</span>
    <input id="inp" placeholder="Ask anything!" autocomplete="off" />
    <button class="send" id="sendBtn">↑</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
const btn = document.getElementById('sendBtn');
const limitEl = document.getElementById('limit');
let count = 0;

function addMsg(text, who='bot'){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = who==='user'? escapeHtml(text) : text.replace(/\n/g,'<br>');
  if(who==='bot'){
    const acts = document.createElement('div');
    acts.className='actions';
    acts.innerHTML=`<button class="btn" onclick="copyText(this)">⎙ Copy</button><button class="btn" onclick="redoLast()">↻ Redo</button>`;
    div.appendChild(acts);
  }
  chat.appendChild(div);
  chat.scrollTo({top: chat.scrollHeight, behavior:'smooth'});
  return div;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

let lastPrompt='';
async function send(){
  const text = inp.value.trim();
  if(!text) return;
  lastPrompt = text;
  addMsg(text,'user');
  inp.value='';
  count++; limitEl.textContent=`Limit: ${count}/100`;
  btn.disabled=true;
  const loading = addMsg('Kirjutan...','bot');
  try{
    const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const data = await r.json();
    loading.remove();
    if(data.reply) addMsg(data.reply,'bot');
    else addMsg('Ühenduse viga: ' + (data.error || 'tundmatu viga'), 'bot');
  }catch(e){
    loading.remove();
    addMsg('Ühenduse viga, proovi uuesti! ('+e.message+')','bot');
  }
  btn.disabled=false;
  inp.focus();
}
function copyText(b){navigator.clipboard.writeText(b.parentElement.parentElement.innerText.replace('⎙ Copy↻ Redo',''))}
function redoLast(){if(lastPrompt){inp.value=lastPrompt; send();}}

btn.onclick=send;
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
